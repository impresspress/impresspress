[package]
name = "minimal-browser"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Smoke test: smallest possible impresspress-browser consumer"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
impresspress-browser = { path = "../../crates/impresspress-browser" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Request", "Response"] }
wafer-run = { workspace = true }

[lints]
workspace = true

# The same wasm-opt arguments as every other browser runtime here
# (`impresspress-web`, `impresspress-browser`): rustc's wasm32 target emits
# bulk-memory and other post-MVP instructions, which wasm-opt refuses to
# validate unless the features are enabled.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--all-features"]

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false
