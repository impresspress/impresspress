# dev.impresspress.org — the browser development sandbox.
#
# `[dev] enabled = true` puts `{ dev: true }` into `sw.js`, which is what lets
# the service worker's `install` import `/seed/manifest.json` as generation 0
# on a fresh origin (`impresspress-core::blocks::dev::seed`) and registers the
# `/b/dev` control-plane page. The wasm this bundle embeds must ALSO be built
# with `impresspress-web/browser-devtools` (see `build.sh`) — this flag alone
# does not put the dev block's code in the binary, it only turns on the
# service-worker plumbing around it.
[app]
name = "dev-sandbox"
title = "ImpressPress dev sandbox"
boot_redirect = "/"

[assets]
# `/seed/` is already bypassed whenever `[dev] enabled` (`impresspress-bundle`
# adds `SEED_BYPASS_PREFIX` itself — see `bundle/mod.rs`), so it is not
# repeated here. `/__impresspress_dev/compiler/` is the compiler-worker
# assets `/b/dev` loads (the module worker + its blob-URL subordinates);
# those are static files served by the host, not runtime routes, so they need
# the same treatment.
extra_bypass_prefix = ["/__impresspress_dev/compiler/"]
# This deployment's only persistent state is what a visitor built in their own
# browser. A wipe-on-recovery default would be a resilience feature for a
# server deployment; here it would be silent data loss for whoever is mid
# build when a transient init failure hits, so it stays off — same as every
# other bundle's default.
opfs_wipe_on_recovery = false

# The seed being built, overlaid onto the bundle wholesale. `seed/` is a
# build output: build.sh stages `seeds/<name>/` (default `blank`) into it,
# because this entry takes no parameters. `apply_overlays` copies a directory
# entry recursively (`crates/impresspress/src/cli/helpers/overlays.rs`).
[[assets.overlay]]
from = "seed"
to = "seed"

# The browser toolchain, built by `compiler/build-compiler.sh` and versioned
# by the rubrc commit `compiler/PIN.json` pins.
#
# `dist/` holds EXACTLY ONE version directory plus the `manifest.json` that
# names it, and this overlay copies all of it: a second version left behind by
# a pin bump would be deployed too, and nothing would have checked it.
# `build-compiler.sh` removes the old one and
# `compiler/scripts/verify-compiler-assets.mjs` (which `build.sh --check`
# runs) fails on anything else under `dist/`. Bumping the pin therefore
# changes every URL, so no cache can serve a stale worker.
[[assets.overlay]]
from = "compiler/dist"
to = "__impresspress_dev/compiler"

[dev]
enabled = true
