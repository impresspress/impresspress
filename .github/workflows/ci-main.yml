name: CI Main

# The merge gate. Every job it shares with the pull-request gate lives in
# `ci-shared.yml`, which `ci.yml` calls with `pull-request: true`; this file
# calls it with `false` and adds the two jobs that are merge-only. See that
# file's header.

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'examples/**'
      - 'packages/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      # `check-audit-expiry.sh` runs in the `audit` job of `audit.yml`, so a
      # change confined to it (or to any other script the shared body grows)
      # must run this workflow. `ci.yml` has always listed this; `ci-main.yml`
      # did not until the parity pull request, which is the one entry the two
      # filters used to disagree on.
      - 'scripts/**'
      - '.github/workflows/ci-main.yml'
      # The workflows this one calls, directly or through `ci-shared.yml`.
      # Without these entries a change to the shared body — which is every job
      # this gate shares with `ci.yml` — would start no merge run at all.
      - '.github/workflows/ci-shared.yml'
      - '.github/workflows/build-wasm.yml'
      - '.github/workflows/audit.yml'
      # The dev-sandbox e2e stages this proof guest into a live browser
      # runtime, so a change to it must run CI.
      - 'experiments/browser-service-worker-blocks/guest/**'

  # Lets a change to this file be exercised before it is the only gate on a
  # merge. `gh workflow run ci-main.yml --ref <branch>` runs THAT branch's
  # version of this file, which is the point: a pull request editing the merge
  # workflow can see its own edit run green before it merges, instead of
  # arguing from the file's text. (`--ref main`, or the Actions UI, re-runs the
  # merge gate as it stands.) A dispatched run resolves `uses:
  # ./.github/workflows/...` against the same ref, so it exercises the branch's
  # shared body too, not `main`'s.
  #
  # The rule bites when the FILE is new to the repository, not when the
  # trigger is new to an existing file. GitHub needs a workflow id to dispatch,
  # and it only mints one for a file on the default branch; given that id it
  # reads the trigger from the file at whatever ref is requested. So a
  # `workflow_dispatch` ADDED on a branch, to a workflow that already exists on
  # the default branch, is dispatchable from that branch straight away —
  # `release.yml` did exactly that in run 34337201873, dispatching its own
  # newly added trigger before merging. A brand-new workflow file still has to
  # land first, which is why this one did.
  # (If the dispatch 404s after that, see `regen-visual-baselines.yml`'s header
  # — a fork with Actions disabled at fork time needs one push to the file on
  # the default branch to index it.)
  workflow_dispatch:

# Keyed on the event name as well as the ref, not the ref alone: with
# `cancel-in-progress` and a group shared across events, a manual dispatch on
# `main` would cancel a live merge run — the merge gate silently losing its
# result to a debugging dispatch. Push behaviour is bit-identical to the plain
# `ci-main` group it replaces, since every merge carries the same event and the
# same ref and so lands in one group exactly as before. The group name is
# evaluated per run from the file at that run's commit, so the one-time cost of
# renaming it is a single extra run: a merge run already in flight when this
# lands keeps its old group, and the next merge joins the new one, so both
# complete instead of one cancelling the other.
concurrency:
  group: ci-main-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only token, matching `ci-shared.yml`. The only job below that needs a
# credential is `coverage`, and it uses `CODECOV_TOKEN`, not `GITHUB_TOKEN`.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-wasm:
    uses: ./.github/workflows/build-wasm.yml

  # See `ci.yml` for what this `needs:` replaced. `cross-compile` and
  # `coverage` below depend on `build-wasm` and not on this call, so they still
  # start as soon as the wasm exists rather than waiting for the shared suite.
  ci:
    needs: build-wasm
    uses: ./.github/workflows/ci-shared.yml
    with:
      pull-request: false

  # The two merge-only jobs. They stay here, and stay merge-only: a merge gate
  # that checks MORE than the pull-request gate hides nothing, which is the
  # asymmetry that is safe. (The reverse — the merge gate checking less — is
  # what `ci-shared.yml` exists to make impossible.) Adding the cross-compile
  # matrix to the pull-request gate is a one-line `uses:` away once it is a
  # reusable workflow of its own; it is not done here so that this pull
  # request's before/after job listing stays empty on both sides.
  cross-compile:
    name: Cross-Compile (${{ matrix.name }})
    needs: build-wasm
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: linux-amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: linux-arm64
            cross: true
          - target: aarch64-apple-darwin
            os: macos-latest
            name: darwin-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            name: darwin-amd64
          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest
            name: windows-amd64
            cross: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: cross-${{ matrix.name }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo '[target.aarch64-unknown-linux-gnu]' >> ~/.cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> ~/.cargo/config.toml

      - name: Install cross-compilation tools (Windows)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64

      # impresspress's build.rs `include_bytes!`s the impresspress-web wasm; the wasm is
      # platform-independent, so download the shared artifact rather than
      # rebuilding it on every target (including the macOS runners).
      - name: Download impresspress-web pkg/
        uses: actions/download-artifact@v4
        with:
          name: impresspress-web-pkg
          path: crates/impresspress-web/pkg

      - name: Build
        run: cargo build --locked -p impresspress --release --target ${{ matrix.target }}

  coverage:
    name: Coverage
    needs: build-wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: coverage

      # impresspress's build.rs `include_bytes!`s the impresspress-web wasm;
      # llvm-cov compiles the workspace, so the prebuilt pkg/ must be present.
      - name: Download impresspress-web pkg/
        uses: actions/download-artifact@v4
        with:
          name: impresspress-web-pkg
          path: crates/impresspress-web/pkg

      - name: Generate coverage
        run: cargo llvm-cov --locked --workspace --exclude impresspress-web --exclude impresspress-cloudflare --lcov --output-path lcov.info

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
