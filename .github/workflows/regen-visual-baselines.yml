name: Regen Visual Baselines

# Manually-triggered workflow that re-runs the visual-baseline Playwright
# suite with `--update-snapshots` against a target branch, then commits and
# pushes any baseline diffs back to that branch.
#
# Why this exists: CI's font/AA rendering on the pinned runner image drifts deterministically
# from local Linux renders for content-heavy mobile cards-table baselines
# (see Phase 5d-C/E handoff). The CI render is the canonical baseline, so when
# a PR touches UI that lands on a flaky-mobile route, regen from CI here.
#
# Usage:
#   gh workflow run regen-visual-baselines.yml -f branch=<branch-name>
#
# Or from the Actions UI: select the workflow and provide a branch input.
#
# If the dispatch 404s, this file is present on the default branch but not
# indexed in that repository's Actions — which is what a fork gets when Actions
# were disabled at fork time. Pushing a change to this file on the default
# branch re-indexes it. Until then the fallback is to take the render straight
# from a failing run: the `playwright-report-visual` artifact holds the
# `*-actual.png` the runner produced, which is byte-identical to what
# `--update-snapshots` would have written here.
#
# The bot push this workflow makes does NOT retrigger a pull request's checks,
# so after a baseline lands, push again yourself or the pull request keeps its
# stale verdict.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to regen baselines on (the workflow checks it out, runs --update-snapshots, and pushes any PNG diffs back)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  regen:
    name: Regen visual baselines on ${{ inputs.branch }}
    # The same pinned image as the jobs in `ci-shared.yml` that compare
    # against what this workflow renders (`e2e-visual`, `products-browser`,
    # `product-examples`): the Ubuntu release supplies the fonts and
    # fontconfig (`playwright install --with-deps` installs them through
    # apt), so a baseline is only valid on the release that rendered it. Move
    # all four labels together, then regen.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          # Need a token that can push commits back to the branch AND whose
          # push re-triggers CI on the branch.
          #
          # GITHUB_TOKEN can push, but GitHub deliberately suppresses workflow
          # runs for events it raises, so a baseline commit pushed with it
          # leaves the PR with no CI verdict at all (or one stuck in
          # `action_required` forever). That defeats the entire point of this
          # workflow: it exists to turn a red visual-baseline job green, and
          # with GITHUB_TOKEN it can never cause that job to re-run.
          #
          # `BASELINE_PUSH_TOKEN` is a PAT or GitHub App installation token with
          # `contents: write`. When present its push raises a normal
          # `pull_request` synchronize event and CI re-runs on the new head.
          # Falling back to GITHUB_TOKEN keeps the workflow usable without the
          # secret; the final step below warns when that happened.
          token: ${{ secrets.BASELINE_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: e2e

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa  # v0.4.0
        with:
          # Pin explicitly — unpinned "latest" falls back to v0.9.1 on a GitHub
          # API flake, which can't parse `license.workspace = true`. Matches
          # `build-wasm.yml`, where CI's copy of this pin lives.
          version: 'v0.15.0'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pre-build impresspress-web wasm (build.rs prereq)
        working-directory: crates/impresspress-web
        run: wasm-pack build --target web --release --out-dir pkg -- --locked

      - name: Install impresspress CLI
        run: cargo install --path crates/impresspress --locked

      - name: Build impresspress-web (framework assets + hashed pkg/)
        working-directory: crates/impresspress-web
        run: impresspress build --target web --release

      - name: Install Playwright
        working-directory: crates/impresspress-web
        # `npm ci`, as CI's `e2e-visual` job does: the lockfile pins the
        # Playwright release, and with it the Chromium build that renders.
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Start native impresspress server in background
        run: |
          cd /tmp
          IMPRESSPRESS_LISTEN="127.0.0.1:8093" \
          IMPRESSPRESS_DB_PATH="/tmp/impresspress-visual-baseline.db" \
          WAFER_RUN_SHARED__AUTH__BOOTSTRAP_ADMIN_EMAIL="admin@example.com" \
          WAFER_RUN_SHARED__AUTH__BOOTSTRAP_ADMIN_PASSWORD="admin123" \
          IMPRESSPRESS_BLOCK_ENABLED="impresspress/userportal,impresspress/vector" \
            impresspress > /tmp/impresspress-baseline.log 2>&1 &
          echo $! > /tmp/impresspress-pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8093/b/auth/login -o /dev/null; then
              echo "server ready after ${i}s"
              break
            fi
            sleep 1
          done
          if ! curl -sf http://127.0.0.1:8093/b/auth/login -o /dev/null; then
            echo "::error::native impresspress did not start within 60s"
            tail -50 /tmp/impresspress-baseline.log
            exit 1
          fi

      - name: Run visual-baseline tests with --update-snapshots
        working-directory: crates/impresspress-web
        env:
          TEST_PORT: 8093
        # The same package script CI's `e2e-visual` job runs, so the same specs
        # run in the same order against the same database. The specs share
        # that database, so whatever an earlier spec leaves behind reaches a
        # later capture unless the suite masks it; running visual-baseline.spec.ts
        # alone would render baselines from a database CI never sees. The
        # counts that follow the suite's own traffic (request-log figures on
        # the admin dashboard, database and network pages) are masked or
        # seeded in the spec — see `volatileMasks` there.
        #
        # `--update-snapshots` overwrites mismatched PNGs in place.
        # Test step succeeds even if snapshots changed; we detect via git diff below.
        run: npm run e2e:visual -- --update-snapshots

      - name: Stop servers
        if: always()
        run: |
          if [ -f /tmp/impresspress-pid ]; then
            kill "$(cat /tmp/impresspress-pid)" 2>/dev/null || true
          fi

      # The products browser-lifecycle specs snapshot into the same
      # e2e snapshot tree but run fully mocked — no native server needed.
      - name: Regen products browser-lifecycle snapshots
        working-directory: crates/impresspress-web
        run: npx playwright test --config=tests/playwright.config.ts tests/e2e/products-*.spec.ts --update-snapshots

      - name: Install examples-suite dependencies
        working-directory: examples
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Regen products static-example snapshots
        working-directory: examples
        run: npm run test:products:update

      - name: Commit and push regenerated baselines
        id: push
        # `${{ inputs.branch }}` is routed through env vars (not interpolated
        # into the script body) to avoid GitHub Actions script-injection.
        env:
          TARGET_BRANCH: ${{ inputs.branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Playwright writes each spec's baselines to `<spec>-snapshots/` beside
          # the spec; the examples suite keeps its own under `examples/tests/`.
          # `:(glob)` leaves the matching to git instead of the shell, so `**`
          # crosses directory boundaries and covers specs nested under `e2e/`
          # as well as ones added directly beside today's.
          BASELINES=(
            ':(glob)crates/impresspress-web/tests/e2e/**/*-snapshots/**'
            'examples/tests/'
          )
          # Use `git status --porcelain` instead of `git diff` so this also
          # picks up untracked baselines — i.e. ones that were deleted in
          # the PR's prior commit and recreated by --update-snapshots.
          # `git status` tolerates a pathspec that matches nothing but `git add`
          # exits 128 on one, so narrow the list to the paths that drifted.
          CHANGED=()
          for spec in "${BASELINES[@]}"; do
            if [ -n "$(git status --porcelain -- "$spec")" ]; then
              CHANGED+=("$spec")
            fi
          done
          if [ ${#CHANGED[@]} -eq 0 ]; then
            echo "::notice::No baseline drift — nothing to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Baseline diff detected:"
          git status --porcelain -- "${CHANGED[@]}"
          git add -- "${CHANGED[@]}"
          git commit -m "test(ui): regen visual baselines from CI render (auto-committed by regen-visual-baselines.yml against ${TARGET_BRANCH})"
          git push origin "HEAD:${TARGET_BRANCH}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # The token check runs in the shell rather than a step-level `if:` so it
      # resolves `BASELINE_PUSH_TOKEN` exactly the way the checkout step does.
      - name: Warn when the push cannot re-trigger CI
        if: steps.push.outputs.pushed == 'true'
        env:
          HAVE_PUSH_TOKEN: ${{ secrets.BASELINE_PUSH_TOKEN != '' }}
        run: |
          if [ "$HAVE_PUSH_TOKEN" = "true" ]; then
            echo "::notice::Pushed with BASELINE_PUSH_TOKEN — CI will re-run on the new head."
            exit 0
          fi
          echo "::warning::Baselines were pushed with GITHUB_TOKEN, so GitHub will not start a CI run for the new commit. The PR keeps its stale failing verdict until someone pushes a further commit under their own credentials. Add a BASELINE_PUSH_TOKEN secret (a PAT or GitHub App installation token with contents: write) to close this loop."
