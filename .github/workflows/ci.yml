name: CI

# The pull-request gate. Every job it runs lives in `ci-shared.yml`, which
# `ci-main.yml` calls with the same arguments but `pull-request: false` — so
# the two gates cannot drift apart by construction. See that file's header.

# No `paths:` filter: every pull request runs the full job set, so `ci / ci-ok`
# (the summary job at the end of `ci-shared.yml`) reports on every pull request
# and can be a required status check. A filtered workflow never starts on a
# pull request outside its paths, which leaves a required check waiting
# forever. Three narrow jobs skip their work on a pull request that does not
# touch their inputs; see `ci-shared.yml`.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only token, matching `ci-shared.yml`. Nothing this gate runs writes to
# the repository.
permissions:
  contents: read

jobs:
  build-wasm:
    uses: ./.github/workflows/build-wasm.yml

  # `needs: build-wasm` orders the six jobs inside `ci-shared.yml` that
  # download the `impresspress-web-pkg` artifact after it. A job cannot depend
  # on a job inside a called workflow, only on the call, so the edge is on the
  # whole call, and every job in `ci-shared.yml` waits for `build-wasm`.
  #
  # `!cancelled()` rather than the implicit `success()`: the call runs whatever
  # `build-wasm` concluded, and `build-wasm-result` carries that conclusion in.
  # The jobs that download the artifact skip unless it is `success` (directly,
  # or through their own `needs:`), the jobs that do not need it still run and
  # report, and `ci / ci-ok` fails on anything but `success`. With `success()` a failed `build-wasm` would
  # skip the whole call, `ci / ci-ok` would never report, and a required
  # check that never reports shows as waiting, not as failed.
  ci:
    needs: build-wasm
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/ci-shared.yml
    with:
      pull-request: true
      build-wasm-result: ${{ needs.build-wasm.result }}
