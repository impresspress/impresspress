  postgres-migrations:
    name: PostgreSQL migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: impresspress_products_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d impresspress_products_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: impresspress_products_test
    steps:
      - uses: actions/checkout@v4

      # Every block that ships a `.postgres.sql` belongs in this loop. A
      # dialect file nothing executes is a typo waiting to brick a Postgres
      # deployment for good: the error aborts the batch, `apply_if_blessed`
      # never stamps the hash, and every later boot re-runs and re-fails.
      #
      # The block set is a GLOB and must stay one. A hand-written list of
      # block names makes the sentence above a claim rather than a fact: a
      # block missing from it is silently unexecuted, and so is every dialect
      # file it ever adds. Sorted order gives each block its own files in
      # migration order, which is the ordering that matters — the only
      # cross-table `REFERENCES` in any dialect file are within one block.
      - name: Apply all PostgreSQL migrations in order
        run: |
          for migration in crates/impresspress-core/src/blocks/*/migrations/*.postgres.sql; do
            echo "applying ${migration}"
            psql --set ON_ERROR_STOP=1 --file "${migration}"
          done

      - name: Verify commerce schema and deterministic templates
        run: |
          test "$(psql --tuples-only --no-align --command "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_name LIKE 'impresspress__products__%'")" -ge 20
          test "$(psql --tuples-only --no-align --command "SELECT count(*) FROM impresspress__products__product_templates WHERE id IN ('simple_product','simple_subscription','configurable_product','configurable_subscription')")" -eq 4
          test "$(psql --tuples-only --no-align --command "SELECT count(*) FROM information_schema.columns WHERE table_name = 'impresspress__products__purchases' AND column_name IN ('shipping_cents','subscription_event_created','provider_payment_status','payment_intent_event_created')")" -eq 4
          test "$(psql --tuples-only --no-align --command "SELECT count(*) FROM information_schema.columns WHERE (table_name, column_name) IN (('impresspress__products__refunds','stripe_event_created'),('impresspress__products__seller_accounts','stripe_event_created'),('impresspress__products__provider_operations','processing_owner'))")" -eq 3

      # The commerce analytics reads six sums through `db::aggregate`: five
      # money columns, every one of them BIGINT here, plus line-item quantity.
      # PostgreSQL's `sum(bigint)` is NUMERIC, which `wafer-block-postgres`
      # decodes through BigDecimal into f64 — so an uncast sum reaches block
      # code as a JSON float, and `crate::util::aggregate_i64` refuses a float.
      # Every sum the analytics reads therefore asks for `CAST(... AS BIGINT)`.
      #
      # `money_figures_read_as_integers_where_an_uncast_sum_is_a_float` drives
      # the real analytics against a context that floats every uncast sum and
      # leaves a BIGINT-cast one an integer. This step pins the PREMISE that
      # test encodes, on a real server: these are the money columns, they are
      # BIGINT, and their uncast sum is NUMERIC. If PostgreSQL or the schema
      # ever stopped making it so, the test would still pass while describing
      # something that no longer happens. That a BIGINT-cast sum decodes as an
      # integer end to end is proven upstream, by wafer-run's PostgreSQL
      # Conformance job (`check_aggregate_money`, wafer-run#336).
      - name: Money sums really are NUMERIC on PostgreSQL
        run: |
          test "$(psql --tuples-only --no-align --command "SELECT count(*) FROM information_schema.columns WHERE (table_name, column_name) IN (('impresspress__products__purchases','total_cents'),('impresspress__products__purchases','refunded_total_cents'),('impresspress__products__purchases','platform_fee_cents'),('impresspress__products__line_items','total_minor'),('impresspress__products__disputes','amount_minor')) AND data_type = 'bigint'")" -eq 5
          test "$(psql --tuples-only --no-align --command "SELECT pg_typeof(sum(total_cents))::text FROM impresspress__products__purchases")" = "numeric"
          test "$(psql --tuples-only --no-align --command "SELECT pg_typeof(sum(amount_minor))::text FROM impresspress__products__disputes")" = "numeric"
          test "$(psql --tuples-only --no-align --command "SELECT pg_typeof(count(*))::text FROM impresspress__products__purchases")" = "bigint"

      # 020 repairs historical `deleted_at = ''` rows. Those rows sit OUTSIDE
      # 005's partial unique slug index (`slug <> '' AND deleted_at IS NULL`),
      # so while one existed another product was free to take its slug —
      # and the repair pulls it back into the index against that slug. A
      # unique violation there aborts the whole migration (only a duplicate
      # ADD COLUMN is tolerated), leaving the hash unstamped so every later
      # boot re-runs and re-fails; on Cloudflare that is a 500 per request.
      # `slug_collision_cannot_fail_020` pins the guard on SQLite — this pins
      # the same behaviour on real PostgreSQL. 020 already ran above against
      # an empty table and is re-runnable.
      - name: Migration 020 tolerates a slug collision
        run: |
          psql --set ON_ERROR_STOP=1 --command "INSERT INTO impresspress__products__products (id, name, slug, deleted_at, created_at, updated_at) VALUES ('blank_jacket', 'bj', 'jacket', '', '2026-01-01T00:00:00Z', '2026-01-01T00:00:00Z'), ('live_jacket', 'lj', 'jacket', NULL, '2026-01-01T00:00:00Z', '2026-01-01T00:00:00Z'), ('blank_hat_a', 'ba', 'hat', '', '2026-01-01T00:00:00Z', '2026-01-01T00:00:00Z'), ('blank_hat_b', 'bb', 'hat', '', '2026-01-01T00:00:00Z', '2026-01-01T00:00:00Z'), ('blank_scarf', 'bs', 'scarf', '', '2026-01-01T00:00:00Z', '2026-01-01T00:00:00Z'), ('blank_noslug', 'bn', '', '', '2026-01-01T00:00:00Z', '2026-01-01T00:00:00Z'), ('live_noslug', 'ln', '', NULL, '2026-01-01T00:00:00Z', '2026-01-01T00:00:00Z')"
          psql --set ON_ERROR_STOP=1 --file crates/impresspress-core/src/blocks/products/migrations/020_normalize_blank_deleted_at.postgres.sql
          test "$(psql --tuples-only --no-align --command "SELECT string_agg(id, ',' ORDER BY id) FROM impresspress__products__products WHERE deleted_at IS NULL")" = "blank_noslug,blank_scarf,live_jacket,live_noslug"
          test "$(psql --tuples-only --no-align --command "SELECT string_agg(id, ',' ORDER BY id) FROM impresspress__products__products WHERE deleted_at = ''")" = "blank_hat_a,blank_hat_b,blank_jacket"

      # 022 rewrites the platform subscription's British `cancelled` to
      # Stripe's `canceled`, the only spelling `SubscriptionStatus` decodes.
      # `a_stored_cancelled_subscription_is_rewritten_to_canceled_by_022` pins
      # it on SQLite; this pins it on real PostgreSQL, twice over, because the
      # block replays its whole migration set whenever the combined hash moves.
      - name: Migration 022 canonicalises the subscription status spelling
        run: |
          psql --set ON_ERROR_STOP=1 --command "INSERT INTO impresspress__products__subscriptions (id, user_id, status, created_at, updated_at) VALUES ('sub_british', 'user_british', 'cancelled', '2026-01-01T00:00:00Z', '2026-01-01T00:00:00Z'), ('sub_stripe', 'user_stripe', 'canceled', '2026-01-01T00:00:00Z', '2026-01-01T00:00:00Z'), ('sub_active', 'user_active', 'active', '2026-01-01T00:00:00Z', '2026-01-01T00:00:00Z')"
          for pass in 1 2; do
            psql --set ON_ERROR_STOP=1 --file crates/impresspress-core/src/blocks/products/migrations/022_canonical_subscription_status.postgres.sql
          done
          test "$(psql --tuples-only --no-align --command "SELECT string_agg(id || '=' || status, ',' ORDER BY id) FROM impresspress__products__subscriptions")" = "sub_active=active,sub_british=canceled,sub_stripe=canceled"

      # Admin 004 collapses repeated `(user_id, role)` grants onto the earliest
      # row and then makes the pair unique. It already ran above against an
      # empty table, so the index exists; it is dropped here to plant what an
      # upgrading deployment holds — two grants of `admin` to one user, one
      # pair tied on `created_at` so the `id` tie-break decides — and the file
      # is run again. `blocks/admin/migrations` pins the same on SQLite.
      - name: Migration admin/004 collapses duplicate role grants
        run: |
          psql --set ON_ERROR_STOP=1 --command "DROP INDEX impresspress__admin__user_roles_user_role_uniq"
          psql --set ON_ERROR_STOP=1 --command "INSERT INTO impresspress__admin__user_roles (id, user_id, role, assigned_by, created_at, updated_at) VALUES ('ur_b_first', 'alice', 'admin', '', '2026-01-01T00:00:00Z', '2026-01-01T00:00:00Z'), ('ur_a_second', 'alice', 'admin', '', '2026-02-01T00:00:00Z', '2026-02-01T00:00:00Z'), ('ur_tie_b', 'bob', 'editor', '', '2026-03-01T00:00:00Z', '2026-03-01T00:00:00Z'), ('ur_tie_a', 'bob', 'editor', '', '2026-03-01T00:00:00Z', '2026-03-01T00:00:00Z'), ('ur_other', 'bob', 'admin', '', '2026-04-01T00:00:00Z', '2026-04-01T00:00:00Z')"
          psql --set ON_ERROR_STOP=1 --file crates/impresspress-core/src/blocks/admin/migrations/004_user_roles_unique.postgres.sql
          test "$(psql --tuples-only --no-align --command "SELECT string_agg(id, ',' ORDER BY id) FROM impresspress__admin__user_roles")" = "ur_b_first,ur_other,ur_tie_a"
          # `if`, not `!`: bash's `-e` ignores a negated command's status.
          if psql --set ON_ERROR_STOP=1 --command "INSERT INTO impresspress__admin__user_roles (id, user_id, role, assigned_by, created_at, updated_at) VALUES ('ur_again', 'alice', 'admin', '', '2026-05-01T00:00:00Z', '2026-05-01T00:00:00Z')"; then
            echo "the unique index did not refuse a repeated grant"
            exit 1
          fi

      # Files 003 gives every legacy (JWT-shaped, unexpiring) share row the
      # lifetime its token used to impose: 365 days for one minted before
      # SEC-055 shortened the TTL, 30 days after, and the migration's own
      # instant when `created_at` cannot be read. Getting either arm wrong
      # silently revokes links that still work or revives links that are
      # dead — neither of which a schema-shape check would catch, so the
      # rows are asserted. `blocks/files/migrations` pins the same on
      # SQLite. 003 already ran above against an empty table and is
      # re-runnable.
      - name: Migration files/003 dates legacy share links by era
        run: |
          psql --set ON_ERROR_STOP=1 --command "INSERT INTO impresspress__files__cloud_shares (id, token, bucket, key, created_by, expires_at, created_at, updated_at) VALUES ('old', 'eyJhbGci.eyJ0eXAi.sig1', 'photos', 'a.png', 'alice', NULL, '2026-04-20T10:00:00Z', '2026-04-20T10:00:00Z'), ('recent', 'eyJhbGci.eyJ0eXAi.sig2', 'photos', 'b.png', 'alice', NULL, '2026-06-01T00:00:00Z', '2026-06-01T00:00:00Z'), ('precise', 'eyJhbGci.eyJ0eXAi.sig3', 'photos', 'c.png', 'alice', '', '2026-09-08T12:34:56.123456789+00:00', '2026-09-08T12:34:56.123456789+00:00'), ('opaque', '9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08', 'photos', 'd.png', 'alice', NULL, '2026-04-20T10:00:00Z', '2026-04-20T10:00:00Z'), ('chosen', 'eyJhbGci.eyJ0eXAi.sig5', 'photos', 'e.png', 'alice', '2027-06-01T00:00:00Z', '2026-04-20T10:00:00Z', '2026-04-20T10:00:00Z'), ('garbled', 'eyJhbGci.eyJ0eXAi.sig6', 'photos', 'f.png', 'alice', NULL, 'not a timestamp', 'not a timestamp'), ('boundary_in', 'eyJhbGci.eyJ0eXAi.sig7', 'photos', 'g.png', 'alice', NULL, '2026-05-14T05:43:03.5+00:00', '2026-05-14T05:43:03.5+00:00'), ('boundary_before', 'eyJhbGci.eyJ0eXAi.sig8', 'photos', 'h.png', 'alice', NULL, '2026-05-14T05:43:02.999+00:00', '2026-05-14T05:43:02.999+00:00')"
          psql --set ON_ERROR_STOP=1 --file crates/impresspress-core/src/blocks/files/migrations/003_legacy_share_token_expiry.postgres.sql
          test "$(psql --tuples-only --no-align --command "SELECT expires_at FROM impresspress__files__cloud_shares WHERE id = 'old'")" = "2027-04-20T10:00:00Z"
          test "$(psql --tuples-only --no-align --command "SELECT expires_at FROM impresspress__files__cloud_shares WHERE id = 'recent'")" = "2026-07-01T00:00:00Z"
          test "$(psql --tuples-only --no-align --command "SELECT expires_at FROM impresspress__files__cloud_shares WHERE id = 'precise'")" = "2026-10-08T12:34:56Z"
          test "$(psql --tuples-only --no-align --command "SELECT expires_at FROM impresspress__files__cloud_shares WHERE id = 'chosen'")" = "2027-06-01T00:00:00Z"
          test "$(psql --tuples-only --no-align --command "SELECT count(*) FROM impresspress__files__cloud_shares WHERE id = 'opaque' AND expires_at IS NULL")" -eq 1
          test "$(psql --tuples-only --no-align --command "SELECT count(*) FROM impresspress__files__cloud_shares WHERE id = 'garbled' AND expires_at IS NOT NULL AND expires_at <= to_char(now() AT TIME ZONE 'UTC', 'YYYY-MM-DD\"T\"HH24:MI:SS\"Z\"')")" -eq 1
          # The boundary second, asserted identically by
          # `the_boundary_second_falls_on_the_thirty_day_arm` on SQLite: a row
          # inside it takes the 30-day arm on BOTH backends, the second before
          # it takes the 365-day arm on both. This is the one comparison the
          # repair turns on, and the two dialects spell it differently.
          test "$(psql --tuples-only --no-align --command "SELECT expires_at FROM impresspress__files__cloud_shares WHERE id = 'boundary_in'")" = "2026-06-13T05:43:03Z"
          test "$(psql --tuples-only --no-align --command "SELECT expires_at FROM impresspress__files__cloud_shares WHERE id = 'boundary_before'")" = "2027-05-14T05:43:02Z"

      # Files 004 adds `objects.claim_id` and 005 `objects.blob_key`. Shipping
      # either changes the hash of the files block's joined SQL, so an
      # upgrading deployment re-runs EVERY files migration over its live rows.
      # This replays the whole set over what the steps above left (the dated
      # share links included) plus stored objects (one naming its blob, one
      # from before 004 and 005) and a reservation in flight, and requires
      # every row of every files table to come back byte-identical — no link
      # re-dated, no bucket or object deleted, no claim or blob key cleared.
      # `replay_tests` in `blocks/files/migrations` pins the same on SQLite.
      - name: Files migrations replay over live rows without changing them
        run: |
          test "$(psql --tuples-only --no-align --command "SELECT count(*) FROM information_schema.columns WHERE table_name = 'impresspress__files__objects' AND column_name = 'claim_id'")" -eq 1
          test "$(psql --tuples-only --no-align --command "SELECT count(*) FROM information_schema.columns WHERE table_name = 'impresspress__files__objects' AND column_name = 'blob_key'")" -eq 1
          psql --set ON_ERROR_STOP=1 --command "INSERT INTO impresspress__files__buckets (id, name, public, created_by, created_at, updated_at) VALUES ('b_photos', 'photos', FALSE, 'alice', '2026-04-20T10:00:00Z', '2026-04-20T10:00:00Z')"
          psql --set ON_ERROR_STOP=1 --command "INSERT INTO impresspress__files__objects (id, bucket, key, size, content_type, status, uploaded_by, uploaded_at, claim_id, blob_key, created_at, updated_at) VALUES ('o_stored', 'photos', 'a.png', 8, 'image/png', 'complete', 'alice', '2026-09-01T00:00:00Z', 'claim-stored', 'claim-stored~a.png', '2026-09-01T00:00:00Z', '2026-09-01T00:00:00Z'), ('o_legacy', 'photos', 'b.png', 4, 'image/png', 'complete', 'alice', '2026-01-01T00:00:00Z', NULL, NULL, '2026-01-01T00:00:00Z', '2026-01-01T00:00:00Z'), ('o_flight', 'photos', 'c.png', 2, 'image/png', 'pending', 'alice', '2026-09-24T00:00:00Z', 'claim-flight', 'claim-flight~c.png', '2026-09-24T00:00:00Z', '2026-09-24T00:00:00Z')"
          snapshot() {
            for table in buckets objects views cloud_shares cloud_access_logs cloud_quotas; do
              psql --tuples-only --no-align --set ON_ERROR_STOP=1 --command "SELECT coalesce(md5(string_agg(t::text, '|' ORDER BY t.id)), 'empty') FROM impresspress__files__${table} t"
            done
          }
          before="$(snapshot)"
          for migration in crates/impresspress-core/src/blocks/files/migrations/*.postgres.sql; do
            echo "replaying ${migration}"
            psql --set ON_ERROR_STOP=1 --file "${migration}"
          done
          after="$(snapshot)"
          echo "before: ${before}"
          echo "after:  ${after}"
          test "${before}" = "${after}"

      # Auth 015 respells readable UTC API-key expiries and revokes the keys
      # whose expiry `repo::parse_iso` cannot read. The line between the two
      # is drawn by hand in each dialect, so each dialect is run against the
      # same cases: `015_api_key_expiry_canonical.cases.tsv`, which
      # `api_key_expiry_tests` holds to `parse_iso` itself and to the SQLite
      # dialect. Every row is seeded, the file is run twice (auth migrations
      # re-run as a set, so the cases must hold after both passes), and any row
      # whose expiry or revocation differs from its case is printed before
      # the count fails the step. 015 already ran above against an empty
      # table.
      - name: Migration auth/015 agrees with the reader, row for row
        env:
          PGCLIENTENCODING: UTF8
          CASES: crates/impresspress-core/src/blocks/auth/migrations/015_api_key_expiry_canonical.cases.tsv
          MIGRATION: crates/impresspress-core/src/blocks/auth/migrations/015_api_key_expiry_canonical.postgres.sql
        run: |
          psql --set ON_ERROR_STOP=1 --command "CREATE TABLE auth_015_cases (stored TEXT PRIMARY KEY, after TEXT NOT NULL, outcome TEXT NOT NULL CHECK (outcome IN ('active', 'revoked')))"
          grep -v '^#' "${CASES}" | psql --set ON_ERROR_STOP=1 --command "\copy auth_015_cases FROM pstdin"
          test "$(psql --tuples-only --no-align --command "SELECT count(*) FROM auth_015_cases")" -eq "$(grep -vc '^#' "${CASES}")"
          psql --set ON_ERROR_STOP=1 --command "INSERT INTO wafer_run__auth__users (id, email, display_name, created_at, updated_at) VALUES ('owner_015', 'owner-015@example.com', 'owner', '2026-01-01T00:00:00Z', '2026-01-01T00:00:00Z')"
          psql --set ON_ERROR_STOP=1 --command "INSERT INTO wafer_run__auth__api_keys (id, user_id, name, key_hash, key_prefix, created_at, expires_at) SELECT stored, 'owner_015', stored, stored, 'sb_legacy', '2026-01-01T00:00:00Z', stored FROM auth_015_cases"
          for pass in first second; do
            echo "015, ${pass} pass"
            psql --set ON_ERROR_STOP=1 --file "${MIGRATION}"
            psql --set ON_ERROR_STOP=1 --command "SELECT c.stored, c.after, c.outcome, k.expires_at, k.revoked_at FROM auth_015_cases c JOIN wafer_run__auth__api_keys k ON k.id = c.stored WHERE k.expires_at IS DISTINCT FROM c.after OR (coalesce(k.revoked_at, '') <> '') <> (c.outcome = 'revoked')"
            test "$(psql --tuples-only --no-align --command "SELECT count(*) FROM auth_015_cases c JOIN wafer_run__auth__api_keys k ON k.id = c.stored WHERE k.expires_at IS NOT DISTINCT FROM c.after AND (coalesce(k.revoked_at, '') <> '') = (c.outcome = 'revoked')")" -eq "$(grep -vc '^#' "${CASES}")"
          done

  # The job lives in `audit.yml` because it also runs weekly on its own
  # schedule; see that file.
  audit:
    uses: ./.github/workflows/audit.yml

  sdk:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history only where the change gate below runs: it diffs
          # against the pull request's base commit, which a shallow clone does
          # not contain. Quoted because GitHub expressions treat the number 0
          # as false, so an unquoted `&& 0 ||` ternary always yields the right
          # branch.
          fetch-depth: ${{ inputs.pull-request && '0' || '1' }}

      - name: Check for SDK changes
        id: sdk-changes
        # Pull requests only: the diff below reads
        # `github.event.pull_request.base.sha`, which no `push` event carries.
        # When this step does not run its `skip` output is empty, so every
        # `skip != 'true'` guard below passes and the job runs in full — the
        # unconditional behaviour the merge gate has always had.
        #
        # The committed OpenAPI snapshots are in the filter because they are an
        # INPUT to this job: `check:types-fresh` regenerates
        # `src/generated/api.ts` from them. A Rust-only change that reshapes a
        # described response body touches no file under `packages/` and would
        # otherwise skip the one job that notices.
        if: inputs.pull-request
        run: |
          CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }}..HEAD -- packages/impresspress-js/ crates/impresspress-core/tests/snapshots/)
          if [ -z "$CHANGED" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.sdk-changes.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and build SDK
        if: steps.sdk-changes.outputs.skip != 'true'
        working-directory: packages/impresspress-js
        run: |
          npm ci
          npm run build
          npm run lint

      # The type-freshness gate. `src/generated/api.ts` is generated from the
      # committed per-block OpenAPI snapshots; regenerating it here and
      # diffing is what makes a reshaped response body a red build in this
      # package rather than a silent contract change. Its reach is only as
      # wide as the snapshots describe, which is why
      # `endpoints_the_sdk_calls_publish_a_response_schema` (Rust) requires a
      # response schema on every endpoint this package calls, and
      # `test/api-coverage.test.ts` re-derives that set from the SDK source.
      - name: Check generated API types are fresh
        if: steps.sdk-changes.outputs.skip != 'true'
        working-directory: packages/impresspress-js
        run: npm run check:types-fresh

      - name: Test SDK
        if: steps.sdk-changes.outputs.skip != 'true'
        working-directory: packages/impresspress-js
        run: npm test

      - name: Smoke-test clean pack/install
        if: steps.sdk-changes.outputs.skip != 'true'
        working-directory: packages/impresspress-js
        run: npm run test:pack-install
