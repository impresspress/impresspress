name: Deploy Browser Demo

on:
  push:
    branches: [main]
    # Every input this job actually builds from. A path missing here is not a
    # skipped run — it is demo.impresspress.org silently left on stale code
    # until some unrelated change happens to trip the filter. Modelled on
    # `deploy-dev-sandbox.yml`, which builds the same way.
    paths:
      - 'crates/impresspress-web/**'
      - 'crates/impresspress-core/**'
      # `impresspress-web` depends on `impresspress-browser` by path, so the
      # OPFS/database/network adapters compile into the wasm this job ships.
      - 'crates/impresspress-browser/**'
      # `cargo install --path crates/impresspress` below builds the CLI that
      # the `impresspress build --target web` step then runs, and that build
      # renders `sw.js` / `loader.js` / `index.html` out of the bundler's
      # asset overlay.
      - 'crates/impresspress/**'
      - 'crates/impresspress-bundle/**'
      # The native server boot (`impresspress-server`) and the native services
      # it builds on, both path dependencies `crates/impresspress/Cargo.toml`
      # declares unconditionally. The CLI reaches them only from `serve`, not
      # the `build` path, so they cannot change the shipped wasm — but they
      # can break the `cargo install` this job depends on, and a break that
      # skips its own gate is the failure this list exists to prevent.
      - 'crates/impresspress-server/**'
      - 'crates/impresspress-native/**'
      # The workspace manifest and the lockfile the `--locked` install
      # resolves against: a wafer-run pin bump changes what every crate above
      # compiles to without touching one of their paths.
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa  # v0.4.0
        with:
          # Pin explicitly — unpinned "latest" falls back to v0.9.1 on a GitHub
          # API flake, and v0.9.1 can't parse `license.workspace = true`.
          # This is live push-to-main infra; matches `build-wasm.yml`'s pin,
          # which is the one CI builds with.
          version: 'v0.15.0'

      # `cargo install --path crates/impresspress` runs the impresspress build.rs,
      # which `include_bytes!`s the impresspress-web wasm. Build it first so
      # build.rs finds it in the canonical pkg/ location.
      - name: Pre-build impresspress-web wasm (build.rs prereq)
        working-directory: crates/impresspress-web
        run: wasm-pack build --target web --release --out-dir pkg -- --locked

      - name: Install impresspress CLI
        run: cargo install --path crates/impresspress --locked

      # Embed × web flow (Cargo.toml + impresspress.toml present): the unified
      # CLI re-runs wasm-pack, then `impresspress_bundle::bundle::run`
      # to drop sw.js / loader.js / index.html / hashed assets into pkg/.
      - name: Build impresspress-web (framework assets + hashed pkg/)
        working-directory: crates/impresspress-web
        run: impresspress build --target web --release

      - name: Add CNAME
        run: echo "demo.impresspress.org" > crates/impresspress-web/pkg/CNAME

      - name: Remove wasm-pack .gitignore (blocks gh-pages deploy)
        run: rm -f crates/impresspress-web/pkg/.gitignore

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DEMO_PAT }}
          external_repository: impresspress/impresspress-demo
          publish_branch: gh-pages
          publish_dir: crates/impresspress-web/pkg
          force_orphan: true
