# cargo-audit exception policy
#
# CI runs `cargo audit` as a BLOCKING check (the `audit` job in
# `.github/workflows/audit.yml`, which both gates call through
# `ci-shared.yml` and which also runs weekly on its own schedule). A new
# vulnerability advisory that isn't listed below fails CI; informational
# advisories (unmaintained / unsound) and yanked crates are reported as
# warnings and never fail plain `cargo audit`.
#
# Every entry in `ignore` must carry an owner + expiry so it gets
# re-triaged instead of living here forever: run `cargo audit --no-fetch`
# (or drop `--no-fetch` for a live advisory-db pull) locally, cross-check
# each listed ID still matches a crate/version actually in Cargo.lock
# (`grep -A2 'name = "<crate>"' Cargo.lock`), and either renew the expiry
# (with a reason) or drop the entry once the dependency is upgraded past
# the affected range. owner = @impresspress-maintainers unless noted.
#
# Re-triaged 2026-10-13 against Cargo.lock (live advisory-db). None of the
# three entries that were here is needed any more:
#   RUSTSEC-2023-0071 (rsa): `rsa` left Cargo.lock in 141ff742, when the
#     sqlx 0.8 -> 0.9 move made sqlx-mysql stop depending on it; the entry
#     has matched nothing since.
#   RUSTSEC-2024-0370 (proc-macro-error): maud 0.27 replaced it with
#     proc-macro2-diagnostics; the workspace now depends on maud 0.27.
#   RUSTSEC-2024-0436 (paste): still in Cargo.lock, with no upgrade path
#     (opt-in `block-fastembed` only: fastembed -> tokenizers 0.23.2 ->
#     macro_rules_attribute, and image -> ravif -> rav1e 0.8.1, all at their
#     latest releases and all requiring `paste ^1`). But it is an
#     informational "unmaintained" warning, which plain `cargo audit` never
#     fails on — the ignore entry changed nothing about pass/fail, it only
#     hid the warning. Dropped so it stays visible, same as the policy below.
# Add an entry here only for an advisory that actually fails `cargo audit`
# (a vulnerability), with owner + expiry.
[advisories]
ignore = []

# Deliberately NOT setting `informational_warnings`: it acts as an allowlist
# — advisories whose `informational` field isn't in the list are dropped
# from the report entirely, not just treated as non-blocking. A previous
# `informational_warnings = ["unmaintained"]` here silently hid `anyhow`
# 1.0.102's RUSTSEC-2026-0190 ("unsound", not "unmaintained") from every
# `cargo audit` run. Leaving this unset shows every informational category;
# none of them block CI by default (only actual vulnerabilities and an
# explicit `-D` do), so nothing here changes pass/fail — it only keeps them
# visible.
#
# Yanked releases: cargo-audit's `ignore` list only takes RUSTSEC IDs, so a
# yanked-crate warning can't be silenced here, and plain `cargo audit` (as CI
# runs it, without `-D yanked`) does not fail on one. Fix them in Cargo.lock
# instead of documenting them: on 2026-10-13 spin 0.9.8 -> 0.9.9 (wasmi,
# flume), spin 0.10.0 -> 0.10.1 (crc-fast) and der 0.8.0 -> 0.8.2 (ureq) were
# all non-yanked semver-compatible bumps, and the informational advisories on
# anyhow (RUSTSEC-2026-0190), event-listener (RUSTSEC-2026-0221) and lru
# (RUSTSEC-2026-0253, via aws-sdk-s3 1.152) were cleared the same way.
# After that, the only warning `cargo audit` reports is paste's (above).
