[workspace]
resolver = "2"
members = [
    "crates/impresspress-browser",
    "crates/impresspress-bundle",
    "crates/impresspress-cloudflare",
    "crates/impresspress-core",
    "crates/impresspress-native",
    "crates/impresspress-password",
    "crates/impresspress-server",
    "crates/impresspress",
    "crates/impresspress-web",
    "crates/wafer-guest",
    "examples/minimal-browser",
    "examples/webmcp-demo",
]
# impresspress-cloudflare is wasm32-only (depends on `worker`/`wasm-bindgen`,
# whose StorageService futures wrap `!Send` JsFuture). Excluded from
# default-members so host `cargo test`/`cargo check` skip it; build it
# explicitly with `cargo <cmd> -p impresspress-cloudflare --target wasm32-unknown-unknown`.
# examples/webmcp-demo is its Cloudflare consumer and wasm32-only for the same
# reason; it is built by `impresspress build --target cloudflare` from its own
# directory.
default-members = [
    "crates/impresspress-browser",
    "crates/impresspress-bundle",
    "crates/impresspress-core",
    "crates/impresspress-native",
    "crates/impresspress-password",
    "crates/impresspress-server",
    "crates/impresspress",
    "crates/impresspress-web",
    "crates/wafer-guest",
    "examples/minimal-browser",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# WAFER runtime (git deps pinned to rev)
wafer-run = { git = "https://github.com/wafer-run/wafer-run", rev = "ef3a510fc3fd1c1b6d00765943877dec8048aa0a", default-features = false }
wafer-block = { git = "https://github.com/wafer-run/wafer-run", rev = "ef3a510fc3fd1c1b6d00765943877dec8048aa0a" }
wafer-core = { git = "https://github.com/wafer-run/wafer-run", rev = "ef3a510fc3fd1c1b6d00765943877dec8048aa0a" }
wafer-sql-utils = { git = "https://github.com/wafer-run/wafer-run", rev = "ef3a510fc3fd1c1b6d00765943877dec8048aa0a" }
wafer-block-cors = { git = "https://github.com/wafer-run/wafer-run", rev = "ef3a510fc3fd1c1b6d00765943877dec8048aa0a" }
wafer-block-crypto = { git = "https://github.com/wafer-run/wafer-run", rev = "ef3a510fc3fd1c1b6d00765943877dec8048aa0a" }
wafer-block-http-listener = { git = "https://github.com/wafer-run/wafer-run", rev = "ef3a510fc3fd1c1b6d00765943877dec8048aa0a" }
wafer-block-inspector = { git = "https://github.com/wafer-run/wafer-run", rev = "ef3a510fc3fd1c1b6d00765943877dec8048aa0a" }
wafer-block-local-storage = { git = "https://github.com/wafer-run/wafer-run", rev = "ef3a510fc3fd1c1b6d00765943877dec8048aa0a" }
wafer-block-network = { git = "https://github.com/wafer-run/wafer-run", rev = "ef3a510fc3fd1c1b6d00765943877dec8048aa0a" }
wafer-block-readonly-guard = { git = "https://github.com/wafer-run/wafer-run", rev = "ef3a510fc3fd1c1b6d00765943877dec8048aa0a" }
wafer-block-router = { git = "https://github.com/wafer-run/wafer-run", rev = "ef3a510fc3fd1c1b6d00765943877dec8048aa0a" }
wafer-block-s3 = { git = "https://github.com/wafer-run/wafer-run", rev = "ef3a510fc3fd1c1b6d00765943877dec8048aa0a" }
wafer-block-security-headers = { git = "https://github.com/wafer-run/wafer-run", rev = "ef3a510fc3fd1c1b6d00765943877dec8048aa0a" }
wafer-block-sqlite = { git = "https://github.com/wafer-run/wafer-run", rev = "ef3a510fc3fd1c1b6d00765943877dec8048aa0a" }
wafer-block-web = { git = "https://github.com/wafer-run/wafer-run", rev = "ef3a510fc3fd1c1b6d00765943877dec8048aa0a" }
wafer-block-postgres = { git = "https://github.com/wafer-run/wafer-run", rev = "ef3a510fc3fd1c1b6d00765943877dec8048aa0a" }
wafer-block-fastembed = { git = "https://github.com/wafer-run/wafer-run", rev = "ef3a510fc3fd1c1b6d00765943877dec8048aa0a" }
wafer-net-security = { git = "https://github.com/wafer-run/wafer-run", rev = "ef3a510fc3fd1c1b6d00765943877dec8048aa0a" }

# Core
async-trait = "0.1.92"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "macros", "rt-multi-thread"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "std", "clock", "wasmbind"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry"] }
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = "0.27"
tracing-opentelemetry = "0.28"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4", "v7"] }
sha2 = "0.11"
hex = "0.4"
getrandom = { version = "0.2" }
dotenvy = "0.15"
rusqlite = { version = "0.32", features = ["bundled"] }

# Cloudflare Workers SDK (wasm-only crates; only used by impresspress-cloudflare)
worker = { version = "0.7.5", features = ["d1"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
maud = "0.27"

# Interim fork of js-sys 0.3.99 carrying wasm-bindgen/wasm-bindgen#5379, the
# futures-executor fix: in stock 0.3.99 a request that Cloudflare stops for a
# CPU limit in the middle of a poll can leave the executor shared by every
# request in the wasm instance never polling anything again ("code had hung"
# at ~0 ms CPU). The fork is the published 0.3.99 crate plus that one change;
# it pins `wasm-bindgen = "=0.2.122"` from crates.io, so it patches alone and
# the `wasm-bindgen-cli` pin in `ci-shared.yml` stays 0.2.122. The test is
# `isolate_executor_tests` in `impresspress-cloudflare/src/lib.rs`.
#
# Remove this `[patch]` once a wasm-bindgen release includes #5379: bump
# wasm-bindgen, js-sys and the CI `wasm-bindgen-cli` pin to that release
# (worker-build picks its CLI from `Cargo.lock`), and re-resolve the lock.
[patch.crates-io]
js-sys = { git = "https://github.com/impresspress/js-sys", rev = "d2b218e824a36e260b924a3b4f39cef0d87b0328" }

[profile.release]
# Size-first wasm profile (CF Worker + browser both ship from `release`).
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
# Two further wasm optimizations were benchmark-gated here and REJECTED by
# measurement (raw `cargo build --target wasm32-unknown-unknown --release`
# .wasm bytes; see the perf/wasm-opt-simd PR for full numbers):
#
#   * Per-package `[profile.release.package.<crypto>] opt-level = 3` (sha2,
#     hmac, pbkdf2, argon2, blake2, hkdf) to speed the login/JWT hot path.
#     Result: BYTE-FOR-BYTE IDENTICAL wasm (same sha256) for both targets.
#     `lto = true` (fat LTO) re-optimizes the merged module at the top-level
#     `-Oz`, discarding each crate's pre-LTO opt-level — the override is a
#     no-op here. Making O3 crypto codegen actually survive would require a
#     global LTO-mode change (e.g. `lto = "thin"`), a whole-bundle tradeoff
#     that needs its own size+perf benchmark, not a "one crate" tweak.
#
#   * `-C target-feature=+simd128` for the wasm32 builds. Result: negligible
#     (browser -122 B, CF -154 B, ~0.02%). The CF Worker has no SIMD-eligible
#     code (crypto uses portable soft backends; `-Oz` disables autovectoriz-
#     ation), so it gains nothing. Only the browser's `vector/score.rs` f32x4
#     dot-product benefits, and only during vector search — a niche win that
#     doesn't justify raising the browser floor to Safari 16.4 or threading
#     RUSTFLAGS through every CI/deploy job (`.cargo/config.toml` is already
#     owned by the gitignored local wafer-run `[patch]` workflow).

[workspace.lints.clippy]
redundant_clone = "warn"
large_enum_variant = "warn"
needless_collect = "warn"
uninlined_format_args = "warn"
cloned_instead_of_copied = "warn"
manual_let_else = "warn"
# `#[expect]` over `#[allow]`: an expectation that stops firing is reported by
# rustc's `unfulfilled_lint_expectations`, so a silenced lint cannot outlive
# the code that needed silencing. `allow_attributes_without_reason` covers
# `expect` too, so every suppression has to say why it is there.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
