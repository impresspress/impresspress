# Every judgment `examples/migration-history.rs` cannot derive from git, each
# with its reason. The generator walks every list state each block's
# migrations were in on main and gives each a verdict by one mechanical rule
# (see the example's docs); anything the rule cannot decide is an error until
# an entry here names it. Every entry must be used.
#
# - `horizon`: states before it are unsupported, for its reason. A block with
#   no entry is supported from its first state.
# - `unsupported`: one state after the horizon that cannot be upgraded.
# - `converges`: an older text of a file (`block/basename@<sha8 of its whole
#   text>`) that a state ran, whose effect today's list reaches once the rest
#   of it runs. The state's schema then equals a fresh install's;
#   `migration_history_tests` proves it.
# - `rerun_safe`: a file whose current statements are idempotent, so a state
#   that ran an older text of it has it pending, and today's text runs.
# - `superseded_basename`: a basename a state carries that today's list does
#   not (a rename). It is never recorded.
#
# States and hashes are the first eight hex digits of `migration_set_hash`.

