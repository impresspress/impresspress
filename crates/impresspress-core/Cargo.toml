[package]
name = "impresspress-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Impresspress shared platform abstraction — routing, crypto, features, pipeline, and backend block factories"

[lib]
name = "impresspress_core"
path = "src/lib.rs"

[features]
# Per-block features default to enabled so the native binary + in-tree
# integration tests see every block that was previously unconditionally
# compiled. `block-fastembed` is deliberately OFF here — previously
# `mod fastembed` was only compiled under `native-embedding`, so adding
# it to defaults would expand the default block set and shift baseline
# screenshots / block listings. Native binaries that want fastembed opt
# in via `native-embedding` (which implies `block-fastembed`).
default = [
    "sqlite",
    "storage-local",
    "llm",
    "block-files",
    "block-messages",
    "block-vector",
    "block-llm",
    "block-legalpages",
    "block-tickets",
    "block-userportal",
    "block-products",
    "block-signal",
    "embed-assets",
]
sqlite = []
# Compile the static assets (CSS/JS/fonts/logos) into the binary. On by
# default so a native single-file binary stays self-contained. The Cloudflare
# build runs `--no-default-features`, so it drops ~370 KB of embedded assets
# automatically — the same fail-safe-lean pattern the block features use.
embed-assets = []
postgres = []
# Exposes `impresspress_core::test_support::TestContext` (the shared in-memory
# SQLite + block harness) as part of the public API so the `tests/`
# integration crates can reuse it instead of hand-rolling a context of their own.
# Pulls `wafer-block-sqlite` in as a regular (non-optional) dep — TestContext
# wires the production `DatabaseBlock` over `SQLiteDatabaseService`. Enabled
# via the self dev-dependency below; never enabled in production builds.
test-support = ["dep:wafer-block-sqlite"]
storage-local = []
storage-s3 = []
# Enable WASM block loading via the wasmi interpreter for auto-discovery.
wasm = ["wafer-run/wasm"]
# LLM feature block (`impresspress/llm`) + its `ProviderLlmService`.
# Phase A's provider service uses `tokio::spawn` + `reqwest::Response`
# futures that are not Send on wasm32-unknown-unknown. Browser LLM
# support arrives in Phase C via a separate `BrowserLlmService`.
# Gate the whole block module off so wasm32 builds compile clean.
#
# `reqwest/stream` is gated here too because it pulls `wasm-streams 0.4`
# on wasm32, which conflicts with `worker`'s `wasm-streams 0.5` — see
# the FFI symbol clash in `worker-build`. OAuth providers don't need
# streaming bodies; only the SSE LLM provider does.
#
# Implies `block-llm` because the provider service backs the
# `impresspress/llm` block dispatch; turning off `block-llm` while leaving
# `llm` on would still drag the block module in.
#
# `block-messages` arrives through `block-llm` below: the llm block declares
# `requires(["impresspress/messages", ..])` and reads and writes every thread
# and entry through `ctx.call_block("impresspress/messages", ..)`, so a build
# without the messages block registered answers every chat turn with a 404.
llm = [
    "dep:tokio",
    "dep:tokio-stream",
    "dep:reqwest",
    "reqwest/stream",
    "block-llm",
]
# Native ONNX-backed embedding block (impresspress/fastembed) + the SQLite
# vector store behind `wafer-run/vector`. Enables the `vectors` feature of
# wafer-block-sqlite (sqlite-vec) for the store; the embedding model is the
# fastembed block's alone, so the store is registered without loading it.
#
# Implies `block-fastembed` and `block-vector` — the native-embedding
# path registers both blocks; leaving them off while turning this on
# would compile-fail.
native-embedding = [
    "dep:wafer-block-sqlite",
    "dep:rusqlite",
    "block-fastembed",
    "block-vector",
]

# Per-block opt-in features. Enabled by default so the native binary +
# in-tree integration tests see every block; consumers that want to
# trim the WASM bundle (specifically wafer-site on
# wasm32-unknown-unknown via the cloudflare adapter) take the crate
# with `default-features = false` and pick the subset they actually
# register at boot.
#
# `block-vector` implies `block-llm` because (post the PR #187 untangle)
# vector reaches llm via `ctx.call_block("impresspress/llm", …)` at
# ingestion time. Calls fail with a runtime 404 if the llm block is
# absent — so a build that has vector enabled but llm absent compiles
# but cannot finish an ingestion. Implying the dep at the Cargo level
# keeps that pairing honest.
block-files = []
block-messages = []
block-vector = ["block-llm"]
# `block-llm` implies `block-messages`: `llm.requires` names
# `impresspress/messages`, and every thread the chat UI lists, every entry it
# renders and every turn it persists goes through
# `ctx.call_block("impresspress/messages", ..)`. Without the messages block
# registered, `dispatch_call` answers `NotFound` and the chat page is empty
# with no error anywhere. Cargo now says what the block always declared.
block-llm = ["block-messages"]
block-legalpages = ["dep:pulldown-cmark"]
block-tickets = []
block-userportal = []
block-products = []
# WebRTC signalling rooms for blockfarming's online play (`impresspress/signal`).
# No sub-dependencies of its own: typed `db::*` client, no crypto, no HTTP client.
block-signal = []
# Browser development sandbox control plane (`impresspress/dev`).
#
# Deliberately OFF in `default`: the block is the sandbox's own control
# plane (compile, stage, activate, export) and must be absent from every
# normal bundle — the security model in the design doc turns on the block
# not existing outside `examples/dev-sandbox`. Consumers that want it opt
# in explicitly, and a second runtime gate (`IMPRESSPRESS__DEV__ENABLED`)
# is checked before its routes are registered.
#
# Pulls in `crc32fast`, used solely by `blocks::dev::zip`'s stored-entry
# writer (the export bundle's checksums) — no other block needs a CRC-32.
block-dev = ["dep:crc32fast"]
# `block-fastembed` pulls in `wafer-block-fastembed` (ONNX Runtime, ~100 MB
# of native deps). The `native-embedding` feature implies this — leaving
# this on without `native-embedding` is fine and just installs the block
# without the SqliteVecService that pairs with it.
block-fastembed = ["dep:wafer-block-fastembed"]

[dependencies]
# WAFER types. The wasmi interpreter is no longer pulled in unconditionally:
# the WasmiBlock use sites in builder.rs (discovery + Path B loader) are
# already gated under impresspress-core's `wasm` feature, which itself activates
# `wafer-run/wasm`. Consumers that don't need runtime WASM-block loading
# (e.g. wafer-site) drop wasmi entirely.
wafer-run = { workspace = true }
# wafer-core for clients and interface traits
wafer-core = { workspace = true }
# wafer-block — wire types + codec used directly by feature blocks that
# encode/decode service payloads (e.g. llm chunks, vector queries).
# `json-schema` pulls in schemars derive support, used by the openapi
# snapshot gate (tests/openapi_snapshot.rs) and, later, by the derive
# migration itself.
wafer-block = { workspace = true, features = ["json-schema"] }
# `chrono04` turns on schemars' impl for `chrono::DateTime<Tz>` (renders as
# `{"type": "string", "format": "date-time"}`), needed by
# `blocks::files::contracts::ObjectInfoResponse::last_modified` — a real
# `chrono::DateTime<Utc>` field, not a pre-formatted `String`.
schemars = { version = "1", features = ["chrono04"] }
# SQL utilities (query builders, value conversion). sea-query is reached
# transitively through this crate — impresspress-core builds no queries with the
# raw sea-query API itself, so it declares no direct sea-query dependency. A
# former direct `sea-query = "0.32"` (default features on) was dead code that,
# via cargo feature unification, silently re-enabled sea-query's `backend-mysql`
# + `derive`/`sea-query-derive` for the whole graph — defeating wafer-sql-utils'
# `default-features = false` trim (wafer-run #317). Removed.
wafer-sql-utils = { workspace = true }
# SSRF predicates (`is_blocked_url`, `is_blocked_ipv4`/`_ipv6`) shared with
# wafer-run's network block, used by `ssrf.rs` and `util.rs`.
wafer-net-security = { workspace = true }
# Native ONNX embeddings (optional — gated behind `block-fastembed`, which
# `native-embedding` implies).
wafer-block-fastembed = { workspace = true, optional = true }
# SQLite vector service (optional — gated behind `native-embedding`): the
# `SqliteVecService` behind `wafer-run/vector` needs a sqlite-vec-enabled
# `rusqlite` connection, so both deps come in together.
wafer-block-sqlite = { workspace = true, optional = true, features = ["vectors"] }
rusqlite = { workspace = true, optional = true }
# CRC-32 for `blocks::dev::zip`'s stored-entry writer (gated behind
# `block-dev` — see the feature comment above).
crc32fast = { version = "1", optional = true }

# Middleware blocks (always registered by the builder).
wafer-block-cors = { workspace = true }
wafer-block-inspector = { workspace = true }
wafer-block-readonly-guard = { workspace = true }
wafer-block-router = { workspace = true }
wafer-block-security-headers = { workspace = true }
wafer-block-web = { workspace = true }

# Crypto primitives (single-source JWT/HMAC/HKDF stack consumed by the
# `crypto` module + feature blocks) and the service block config trait
# needed by the builder.
wafer-block-crypto = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Crypto. The JWT/HMAC/HKDF/argon2 primitives live in
# `wafer_block_crypto::primitives` (single source of truth) — only the
# hashing/encoding helpers used directly by feature blocks remain here.
sha2 = { workspace = true }
base64ct = { version = "1", features = ["alloc"] }
getrandom = "0.2"

# Time
chrono = { workspace = true }

# Unique IDs for repo row generation
uuid = { workspace = true }

# Async
async-trait = { workspace = true }
futures = "0.3"
tokio-util = "0.7"
thiserror = "2"
# tokio / tokio-stream / reqwest are only used by the LLM providers
# module (native HTTP streaming + `tokio::spawn`). That module is gated
# behind the `llm` feature — keep these deps optional so wasm32 builds
# that turn the feature off don't pull in the `rt-multi-thread` tokio
# feature (forbidden on wasm) or the native `reqwest` stack.
tokio = { workspace = true, optional = true }
tokio-stream = { version = "0.1", optional = true }
# HTTP client used by the OAuth provider implementations (always on) and
# the LLM provider streaming service (gated behind `llm`). The `stream`
# sub-feature — required for SSE streaming in the LLM block — is added
# by the `llm` feature, not here, because it pulls `wasm-streams 0.4`
# on wasm32 which conflicts with `worker`'s `wasm-streams 0.5`.
reqwest = { workspace = true, optional = true }

# URL parsing/building for OAuth authorize_url assembly + form-body encode/
# decode (`url::form_urlencoded`). `percent-encoding` (url's own dependency)
# drives `url_path_encode`'s RFC-3986 path-segment AsciiSet.
url = "2"
percent-encoding = "2"

# Markdown → HTML renderer for the legalpages block. Replaces the
# ammonia HTML-sanitizer pipeline. Optional + gated under
# `block-legalpages` so consumers that disable that block (wafer-site)
# drop pulldown-cmark + the html5ever transitive subtree entirely.
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"], optional = true }

# SSR templating
maud = "0.26"

# Logging
tracing = "0.1"

[lints]
workspace = true

[build-dependencies]
sha2 = { workspace = true }

[dev-dependencies]
# Self dev-dependency with `test-support` so the `tests/` integration crates
# can `use impresspress_core::test_support::TestContext` (the shared in-memory
# harness) instead of re-implementing it. A self dev-dep is the standard way
# to feature-gate a test-only public module without leaking it into the
# production lib build.
#
# `default-features = false` because a dev-dependency's features are unified
# into the package's own build whenever a test target is compiled. Spelled
# without it, this line re-enables `default` — and so `llm` — in every
# `cargo test --no-default-features` run, including the CI lane whose whole
# purpose is to compile the vector block with the llm backend absent. The
# features a run asks for on the command line still apply; this only stops the
# dev-dep from adding `default` back on top of them.
impresspress-core = { path = ".", default-features = false, features = [
    "test-support",
] }
# `net` + `io-util` let the LLM provider tests answer a chat request from a
# real socket (partial SSE body, then close or hang), which is the only way to
# exercise the streaming client's truncation and read-timeout handling.
tokio = { workspace = true, features = ["macros", "rt", "time", "net", "io-util"] }
tempfile = "3"
# Test-fixture setup only: `blocks::vector::legacy_names` builds an index in
# the shape the pre-lowercase code wrote, which the vector service now refuses
# to create, straight onto the SQLite file its `SqliteVecService` opens.
rusqlite = { workspace = true }
# Dev-dep so integration tests can drive the SQLite database service even
# when the `native-embedding` feature (which makes wafer-block-sqlite a
# regular optional dep) is off.
wafer-block-sqlite = { workspace = true }
wafer-block-http-listener = { workspace = true }
async-trait = { workspace = true }
# The `tests/` crates are separate compilation units, so they cannot reach the
# lib's own `base64ct`. Same crate, same standard alphabet + padding as the
# `blocks::dev::files` handlers encode with, so a round-trip assertion in
# `tests/dev_files.rs` compares like with like.
base64ct = { version = "1", features = ["alloc"] }
# Layer-3 HTTP end-to-end tests (tests/auth_http) drive the block through
# a real axum server on an ephemeral port using reqwest as the client.
# (reqwest itself comes from the main `[dependencies]` section now.)
axum = "0.8"
# Mock upstream OAuth providers in integration tests.
wiremock = "0.6"
# Guard test (ui::mod::tests::pages_carry_no_static_inline_styles) walks
# src/blocks and src/ui looking for stray inline `style=` attributes.
walkdir = "2"
# Reads back `blocks::dev::zip`'s stored-entry archives in its own tests
# (`default-features = false` — the writer needs no compression backend, so
# the reader shouldn't pull one in either).
zip = { version = "2", default-features = false }
# `tests/manifest_block_parity.rs` reads this crate's, impresspress-web's and
# impresspress-cloudflare's `Cargo.toml` and compares their `block-*` sets. It
# parses them rather than grepping: a hand-rolled line matcher on a manifest is
# the sort of approximate second implementation that goes stale exactly like
# the "keep in sync" comments that test replaces.
toml = "1"
# `tests/repo_door.rs` resolves each file's `use` trees (aliases, `self as`,
# globs, imports through an alias) to decide which door constant a bare or
# aliased path names. Parsing is the same choice as `toml` above: a text
# matcher over `use` lines misses shapes rustfmt produces and matches inside
# comments.
syn = { version = "2", default-features = false, features = ["full", "parsing", "visit"] }
proc-macro2 = { version = "1", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
js-sys = "0.3"
# `uuid` on wasm32 needs a JS-backed RNG source (uuid 1.21+ compile-errors
# without one of `js`, `rng-getrandom`, or `rng-rand`). Consumers like
# impresspress-cloudflare and impresspress-web already enable `uuid/js` explicitly
# in their own manifests; this stanza makes a bare
# `cargo check -p impresspress-core --target wasm32-unknown-unknown` build
# clean too, without affecting native builds.
uuid = { workspace = true, features = ["js"] }
