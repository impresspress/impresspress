# A sandbox block: one crate, one dependency.
#
# The browser toolchain that compiles this has no registry access, so the
# only dependency a block can have is the guest SDK beside it, by path — the
# same path in the workspace, in the compiler's VFS and in an export archive.
# Nothing else goes in this table.

[package]
name = "newsletter"
version = "0.1.0"
edition = "2021"

[lib]
# `cdylib` is what produces a `.wasm` module with the ABI exports the
# runtime looks for. Do not change it.
crate-type = ["cdylib"]

[dependencies]
wafer_guest = { path = "../../wafer_guest" }

# The sandbox accepts an artifact of at most 4 MiB, and these settings keep a
# block well under it. What each one is for:
#
# * `opt-level = "z"` optimises for size.
# * `lto = false` is deliberate: link-time optimisation doubled the in-browser
#   compile for about 22 KB of artifact, so a block trades those bytes for
#   half the wait.
# * `codegen-units = 1` because parallel codegen is a loss inside the
#   in-browser compiler (16 units built two and a half times slower).
# * `panic = "abort"` drops the unwinding machinery. It also means a panic in
#   a handler traps the instance instead of unwinding — return an error
#   response rather than panicking on anything a caller can cause.
# * `strip = true` drops the symbol names and debug info from the module.
[profile.release]
opt-level = "z"
lto = false
codegen-units = 1
panic = "abort"
strip = true
