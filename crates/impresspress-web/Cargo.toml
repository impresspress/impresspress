[package]
name = "impresspress-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Impresspress compiled to WASM for running in the browser via Service Worker"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Feasibility spike: embed WAFER's interpreter so wasm32-wasip1 guest blocks
# can be loaded from bytes by the browser-hosted ImpressPress runtime. This is
# intentionally opt-in until the browser editor/compiler pipeline exists.
dynamic-wasm-blocks = ["wafer-run/wasmi"]
# The browser development sandbox: the `impresspress/dev` control plane plus
# wasmi for the guest blocks it activates. Off by default; a bundle built with
# it still needs `[dev] enabled = true` in `impresspress.toml` to register
# anything, and a bundle built without it ignores the flag entirely — the
# sandbox's security model is that the block is absent from normal
# deployments, not merely switched off in one.
# `web-sys/ServiceWorkerGlobalScope` + `WorkerGlobalScope`: seed-on-boot
# fetches `/seed/manifest.json` from the worker's own global (`web_sys::window()`
# is `None` there). Pulled in by the feature rather than unconditionally, so a
# feature-off build compiles exactly the web-sys surface it did before.
browser-devtools = [
    "dynamic-wasm-blocks",
    "impresspress-core/block-dev",
    "web-sys/ServiceWorkerGlobalScope",
    "web-sys/WorkerGlobalScope",
]

[dependencies]
# Browser framework (platform services + SW plumbing)
impresspress-browser = { path = "../impresspress-browser" }

# WASM bindings
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    # `RequestInit` + `RequestCache` are what let `dev_runtime`'s
    # `BrowserShellSource` fetch the static shell with `cache: 'no-store'` —
    # an export must never copy a previous deployment's bytes out of the HTTP
    # cache under this build's content-hashed names.
    "Request", "RequestInit", "RequestCache", "Response", "ResponseInit",
    "Headers", "ReadableStream",
    "Url",
    "console",
] }
js-sys = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# WAFER runtime (no tokio, no wasmi, no reqwest)
wafer-run = { workspace = true }
wafer-core = { workspace = true }
wafer-block = { workspace = true }

# Impresspress shared core (builder + flows + router + feature blocks).
# Absorbed today's impresspress (lib) crate. `default-features = false`
# strips the native block set; the explicit `features` list pulls back
# in the wasm32-clean feature blocks so `register_all_static_blocks`
# actually registers them. Without this list every `impresspress/<name>`
# route returns "block not found" — linkme `register_static_block!`
# doesn't emit on wasm32, so the manual register helper is the only
# registration site, and every entry in it is
# `#[cfg(feature = "block-X")]`-gated.
#
# This list is checked against `impresspress-core`'s block features and
# `impresspress-cloudflare`'s passthroughs by
# `impresspress-core/tests/manifest_block_parity.rs`, which is where any
# difference between the three is written down with its reason. It replaces
# the "keep in sync with impresspress-cloudflare/Cargo.toml" comment that used
# to sit here — that one stayed accurate and its Cloudflare counterpart did
# not, which is exactly the failure mode a comment cannot catch.
#
# (`block-llm`/`block-vector` were once excluded here because the old
# LlmBlock pulled tokio/reqwest on wasm32; the LlmService trait refactor
# made both wasm32-clean and they're now part of the demo's block set.)
impresspress-core = { path = "../impresspress-core", default-features = false, features = [
    # `default-features = false` here is about excluding NATIVE-only defaults
    # from a wasm32 build, not about detaching assets — so `embed-assets` has
    # to be asked for back explicitly.
    #
    # A browser bundle is self-contained: it is downloaded whole, served off a
    # static directory, and has no second origin to fetch from. Nothing
    # publishes `ui::assets` for it (`impresspress_bundle::assets` writes only
    # the loader, the SW template and sql-wasm) and nothing sets
    # `IMPRESSPRESS_ASSET_BASE_URL`, so without this every `/b/static/*` URL —
    # the stylesheet, `webmcp.js`, the fonts, the mark — resolves to a route
    # that is compiled out and 404s.
    #
    # Detaching exists for Cloudflare, where R2 or a CDN actually serves the
    # bytes and the wasm size limit is real. `impresspress-cloudflare` keeps
    # its own opt-in passthrough for exactly that.
    "embed-assets",
    "block-files",
    "block-legalpages",
    "block-tickets",
    # `block-llm` (NOT `llm`): registers the `impresspress/llm` feature block —
    # chat UI + thread persistence — on wasm32. It holds a `NoopProviderAdmin`
    # (no native HTTP `ProviderLlmService`); chat routes through the
    # browser-supplied `BrowserLlmService` on the shared `wafer-run/llm` router.
    "block-llm",
    "block-messages",
    "block-products",
    "block-userportal",
    # `block-vector`: the vector-indexes admin UI (`impresspress/vector`). The
    # browser provides real vector + embedding services (BrowserVectorService +
    # transformers-embed), so the page is fully functional in the demo. The old
    # exclusion predates the LlmService refactor that made this wasm32-clean.
    "block-vector",
    # `block-signal`: WebRTC signalling rooms (`impresspress/signal`). Typed
    # `db::*` client only — no native HTTP client, no crypto beyond what's
    # already pulled in — so it is wasm32-clean with nothing extra to wire.
    "block-signal",
] }

# Config service (needed for EnvConfigService::new() and ConfigService::set())

# Async traits
async-trait = "0.1"

# Futures utilities (BoxStream + stream helpers for the LlmService impl)
futures = "0.3"

# CancellationToken — used by the LlmService trait signatures
tokio-util = { version = "0.7", default-features = false }

[lints]
workspace = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--all-features"]

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
# uuid v4 needs a JS RNG source on wasm32
uuid = { version = "1", features = ["v4", "js"] }
