<template id="wizard-variable-row"><div class="offer-row" data-variable-row><div class="offer-row__head"><strong>Customer input</strong><button class="btn btn--secondary btn--sm" type="button" data-action="pw-remove-row">Remove</button></div><div class="grid grid-auto-150 gap-3 mt-3"><div class="form-group"><label class="form-label required" for="wizard-variable-key">Key</label><input class="form-input" id="wizard-variable-key" data-variable-key required placeholder="quantity"></div><div class="form-group"><label class="form-label required" for="wizard-variable-label">Label</label><input class="form-input" id="wizard-variable-label" data-variable-label required placeholder="Quantity"></div><div class="form-group"><label class="form-label" for="wizard-variable-kind">Type</label><select class="form-select" id="wizard-variable-kind" data-variable-kind data-action="pw-variable-kind-changed"><option value="integer">Whole number</option><option value="number">Decimal number</option><option value="date">Date</option><option value="date_time">Date and time</option><option value="boolean">Yes / no</option><option value="select">Choice</option><option value="multi_select">Multiple choices</option><option value="text">Text</option></select></div><div class="form-group" data-variable-min-wrap><label class="form-label" for="wizard-variable-min">Minimum</label><input class="form-input" id="wizard-variable-min" data-variable-min inputmode="decimal"></div><div class="form-group" data-variable-max-wrap><label class="form-label" for="wizard-variable-max">Maximum</label><input class="form-input" id="wizard-variable-max" data-variable-max inputmode="decimal"></div><div class="form-group" data-variable-step-wrap><label class="form-label" for="wizard-variable-step">Step</label><input class="form-input" id="wizard-variable-step" data-variable-step inputmode="decimal"></div><div class="form-group" data-variable-options-wrap><label class="form-label" for="wizard-variable-options">Choices</label><input class="form-input" id="wizard-variable-options" data-variable-options placeholder="small, medium, large"></div><div class="form-group"><label class="form-label" for="wizard-variable-visibility">Visibility</label><select class="form-select" id="wizard-variable-visibility" data-variable-visibility><option value="public">Customer</option><option value="hidden">Hidden</option><option value="admin_only">Admin only</option></select></div><div class="form-group"><label class="form-label" for="wizard-variable-default">Default value</label><input class="form-input" id="wizard-variable-default" data-variable-default placeholder="Optional"></div><div class="form-group" data-variable-length-wrap><label class="form-label" for="wizard-variable-length">Maximum text length</label><input class="form-input" id="wizard-variable-length" data-variable-length type="number" min="1" max="10000"></div></div><label class="offer-row__check"><input type="checkbox" data-variable-required>Required</label><div class="form-group"><label class="form-label" for="wizard-variable-help">Help text</label><input class="form-input" id="wizard-variable-help" data-variable-help maxlength="500" placeholder="Shown beside this input"></div></div></template><template id="wizard-component-row"><div class="offer-row" data-component-row><div class="offer-row__head"><strong>Price row</strong><button class="btn btn--secondary btn--sm" type="button" data-action="pw-remove-row">Remove</button></div><div class="grid grid-auto-150 gap-3 mt-3"><div class="form-group"><label class="form-label required" for="wizard-component-key">Key</label><input class="form-input" id="wizard-component-key" data-component-key required placeholder="base"></div><div class="form-group"><label class="form-label required" for="wizard-component-label">Label</label><input class="form-input" id="wizard-component-label" data-component-label required placeholder="Base price"></div><div class="form-group"><label class="form-label" for="wizard-component-description">Description</label><input class="form-input" id="wizard-component-description" data-component-description maxlength="500"></div><div class="form-group"><label class="form-label" for="wizard-component-type">Calculation</label><select class="form-select" id="wizard-component-type" data-component-type><option value="fixed">Fixed amount</option><option value="per_unit">Amount × input</option><option value="flat_plus_per_unit">Base + amount × input</option><option value="lookup">Price selected by input</option><option value="graduated">Graduated tiers</option><option value="volume">Volume tiers</option><option value="package">Packages / blocks</option></select></div><div class="form-group"><label class="form-label required" for="wizard-component-amount">Amount / unit rate</label><input class="form-input" id="wizard-component-amount" data-component-amount inputmode="decimal" value="0.00" required></div><div class="form-group"><label class="form-label" for="wizard-component-input">Pricing input key</label><input class="form-input" id="wizard-component-input" data-component-input placeholder="quantity"></div><div class="form-group"><label class="form-label" for="wizard-condition">Condition</label><select class="form-select" id="wizard-condition" data-component-condition><option value="always">Always include</option><option value="equals">Input equals value</option><option value="not_equals">Input does not equal value</option><option value="greater_than">Input is greater than value</option><option value="greater_than_or_equal">Input is at least value</option><option value="less_than">Input is less than value</option><option value="less_than_or_equal">Input is at most value</option><option value="contains">Input contains value</option><option value="in">Input is one of these values</option><option value="present">Input is present</option><option value="advanced_preserved" hidden>Advanced condition (preserved)</option></select></div><div class="form-group"><label class="form-label" for="wizard-condition-input">Condition input</label><input class="form-input" id="wizard-condition-input" data-condition-input></div><div class="form-group"><label class="form-label" for="wizard-condition-value">Condition value</label><input class="form-input" id="wizard-condition-value" data-condition-value></div></div><details class="my-3"><summary>Advanced calculation details</summary><div class="grid grid-auto-180 gap-3 mt-3"><div class="form-group"><label class="form-label" for="wizard-component-base">Base amount</label><input class="form-input" id="wizard-component-base" data-component-base inputmode="decimal" value="0.00"><p class="text-muted text-sm">Used by base + per-unit pricing.</p></div><div class="form-group"><label class="form-label" for="wizard-component-package-size">Units per package</label><input class="form-input" id="wizard-component-package-size" data-component-package-size type="number" min="1" value="1"><p class="text-muted text-sm">Used by package pricing.</p></div><div class="form-group"><label class="form-label" for="wizard-component-rounding">Partial packages</label><select class="form-select" id="wizard-component-rounding" data-component-rounding><option value="up">Round up and charge a package</option><option value="exact">Require an exact multiple</option></select></div></div><div class="form-group"><label class="form-label" for="wizard-component-details">Lookup prices or tiers</label><textarea class="form-textarea" id="wizard-component-details" data-component-details rows="4" placeholder="Lookup: small = 10.00
Tier: 10 | 1.00 | 0.00
Final tier: * | 0.80 | 0.00"></textarea><p class="text-muted text-sm">Lookup rows use <code>choice = amount</code>. Tier rows use <code>upper bound | unit amount | flat amount</code>; use <code>*</code> for the final open tier.</p></div></details><label class="offer-row__check"><input type="checkbox" data-component-required>Required row</label></div></template>
