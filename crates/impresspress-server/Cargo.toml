[package]
name = "impresspress-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The native impresspress server runtime: seeds platform state, builds and boots the runtime, serves HTTP"

# Backend and storage features (sqlite / postgres / storage-local / s3, the
# block-* set) are the consumer's choice: it enables them on
# `impresspress-core` and `impresspress-native`, and they unify here.

[dependencies]
anyhow = "1"
impresspress-core = { path = "../impresspress-core", default-features = false }
impresspress-native = { path = "../impresspress-native" }
# The password pepper settings, read from the process environment.
impresspress-password = { path = "../impresspress-password" }

wafer-run = { workspace = true, features = ["full"] }
wafer-core = { workspace = true }
# `wafer_async_trait` macro for the native `BootHooks` impl (the macro's
# expansion references the `async-trait` crate directly).
wafer-block = { workspace = true }
async-trait = { workspace = true }

tracing = { workspace = true }
# `select!` between the boot and the migration lock's loss.
tokio = { workspace = true, features = ["macros"] }

[lints]
workspace = true

[dev-dependencies]
# The tests build and boot the runtime a native build ships, so they need
# every block `impresspress-core` turns on by default. The `[dependencies]`
# entry above takes core with `default-features = false` (the consumer
# chooses), so without this a `cargo test -p impresspress-server` run would
# boot a runtime with no feature blocks at all — about 2 MB instead of about
# 20 MB — and the runtime probes would only cover the full set when another
# selected package happened to enable it. `test-support` for the migration
# history engine `tests/boot_migrations.rs` builds pre-ledger databases with.
impresspress-core = { path = "../impresspress-core", features = ["test-support"] }
wafer-sql-utils = { workspace = true }
tempfile = "3"
# Signs the access JWT `tests/runtime_drop.rs` authenticates through the
# runtime, the way auth-ui signs one.
wafer-block-crypto = { workspace = true }
tokio = { workspace = true, features = ["full"] }
reqwest = { workspace = true }
serde_json = { workspace = true }
