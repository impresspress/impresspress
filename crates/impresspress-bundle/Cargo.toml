[package]
name = "impresspress-bundle"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native web-bundle tooling for `impresspress build --target web`: static framework assets + the wasm-pack output hashing/manifest/template bundler"

[features]
# `bundle::sandbox_mode::fixture`: the encoder every test fixture `bundle::run`
# reads is written with — this crate's integration tests, and the
# `impresspress` and `impresspress-core` tests that bundle a fake runtime.
test-support = []

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
# Self dev-dependency with `test-support`, so `tests/` can write its fixtures
# with `bundle::sandbox_mode::fixture` without the module reaching the lib's
# own build.
impresspress-bundle = { path = ".", features = ["test-support"] }

[lints]
workspace = true
