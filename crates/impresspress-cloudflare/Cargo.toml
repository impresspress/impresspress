[package]
name = "impresspress-cloudflare"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cloudflare Workers adapter for impresspress (D1, R2, wasm crypto/network, worker entry helpers)"

[lib]
# `rlib` so the `pub async fn run` worker entry shim is consumable from
# other Rust crates (e.g. wafer-site's cloudflare cdylib calling
# `impresspress_cloudflare::run` from its `#[event(fetch)]` handler).
# `cdylib` retained for direct use by `worker-build`.
crate-type = ["cdylib", "rlib"]

[features]
# Lean-by-default: `default = []` ships only the always-on core blocks
# (admin/auth-ui/email/system/auth — registered unconditionally by
# `impresspress-core::blocks::register_feature_blocks`, no `block-*` feature
# needed). A representative consumer (wafer-site's Cloudflare target) enables
# zero optional blocks — measured at 14.5% bloat when this default pulled
# files/legalpages/messages/products/userportal in anyway because the
# consumer forgot `default-features = false`. `default = []` makes "forgot to
# opt out" fail safe (lean) instead of fail bloated.
#
# Consumers that DO want the full block set take `features = ["full"]`
# (or `default-features = false, features = ["full"]` to be explicit).
default = []
# Convenience preset: every optional block, matching the set this crate used
# to enable by default. Dropping `block-legalpages` alone (from either preset)
# strips `pulldown-cmark` + its html5ever transitive subtree entirely.
full = [
    "block-files",
    "block-legalpages",
    "block-tickets",
    "block-messages",
    "block-products",
    "block-userportal",
    "block-signal",
]
# Passthrough block features → forwarded to `impresspress-core`. The block
# register sites in impresspress-core are `#[cfg(feature = "block-X")]`-gated
# (`register_feature_blocks`), so enabling these here is what makes the
# corresponding `impresspress/<name>` routes resolve.
#
# This set is checked against `impresspress-core`'s and
# `impresspress-web/Cargo.toml`'s by
# `impresspress-core/tests/manifest_block_parity.rs`, which is where any
# difference between the three is written down with its reason. It replaces
# the "keep in sync" comment that used to sit here and drifted anyway.
block-files = ["impresspress-core/block-files"]
block-legalpages = ["impresspress-core/block-legalpages"]
block-tickets = ["impresspress-core/block-tickets"]
block-messages = ["impresspress-core/block-messages"]
block-products = ["impresspress-core/block-products"]
block-userportal = ["impresspress-core/block-userportal"]
# Signalling for blockfarming's WebRTC online play — typed `db::*` client
# only, no crypto/HTTP deps, so it costs nothing extra beyond the block
# itself and is safe to include in `full`.
block-signal = ["impresspress-core/block-signal"]
# `block-llm` (the feature block, NOT the `llm` native provider backend) and
# `block-vector`. Both are wasm32-clean: the block holds a
# `NoopProviderAdmin`, and `llm`/`native-embedding` — the features that pull
# `tokio`, `reqwest` and ONNX Runtime — stay off. Offered, and deliberately in
# neither `default` nor `full`: on the measurement below a Worker that asks
# for both pays for them, and one that does not pays nothing at all.
#
# ## What each one actually turns on
#
# Neither is one block. In `impresspress-core`, `block-llm` implies
# `block-messages` and `block-vector` implies `block-llm`, so:
#
#   block-llm     ->  impresspress/llm + impresspress/messages
#   block-vector  ->  impresspress/vector + both of the above
#
# Those implications are declarations, not conveniences: `llm.requires` names
# `impresspress/messages` and every thread, entry and turn the chat UI touches
# goes through `ctx.call_block("impresspress/messages", ..)`. But they are a
# SURFACE change, not only byte accounting — a Worker that opts into the chat
# interface also registers the `/b/messages` routes, which it never named.
# Both rows below therefore include the implied blocks.
#
# `block-vector` additionally buys a 503 surface unless the consumer does more.
# This adapter injects neither a vector service nor an embedding service, so a
# Worker that only flips the feature registers `impresspress/vector` with no
# backend and every route answers `503 Unavailable`. It is not inert by
# construction — `run_with_config`'s registration hook takes
# `ImpresspressBuilder::vector_service` and `::embedding_service` — but wiring
# those is the consumer's job, and without it the feature buys routes that
# cannot serve.
#
# ## Cost
#
# Measured against a real Worker — `examples/webmcp-demo`, which is a cdylib
# whose `#[event(fetch)]` calls `impresspress_cloudflare::run`. (Building THIS
# crate alone is not a measurement: it exports no Worker entry point, so the
# linker discards every block and the .wasm is the same size whatever features
# are on.) The demo declares no passthrough of its own, so the extra feature is
# named through the dependency:
#
#   cargo build --release -p impresspress-webmcp-demo \
#       --target wasm32-unknown-unknown --no-default-features \
#       --features target-cloudflare[,impresspress-cloudflare/block-<name>]
#
#   as shipped (block-products only)   ~7.79 MB
#   + block-llm (+ messages)           ~8.24 MB   (about +0.45 MB)
#   + block-vector (+ both)            ~8.53 MB   (about +0.74 MB)
#
# Rounded on purpose: the exact byte counts move with every commit, and these
# are cargo's own wasm, BEFORE `worker-build`'s wasm-opt and before the gzip
# the platform's size limit is actually applied to. Neither step preserves
# pre-optimisation ratios, so these are the relative cost of adding the blocks
# to this build, not what a consumer pays against the limit. Re-measure rather
# than scale them.
#
# Declaring a feature nobody enables costs nothing, and that was measured too,
# not assumed: the demo Worker is byte-identical built against the manifest
# with and without this stanza.
block-llm = ["impresspress-core/block-llm"]
block-vector = ["impresspress-core/block-vector"]

# Not enabled by any preset above, and not part of `default-features = false`
# on the `impresspress-core` dependency below. `run_with_config` (`lib.rs`)
# always serves `/b/static/` straight from the R2 bucket binding UNLESS this
# is on — matching the native `impresspress` CLI crate's own
# `embed-assets = ["impresspress-core/embed-assets"]` passthrough. A consumer
# that flips this on gets `impresspress-core`'s embedded byte path instead
# (via ordinary `wafer.run()` block dispatch through `SystemBlock`) at the
# cost of the wasm bloat `embed-assets` exists to avoid on this target.
embed-assets = ["impresspress-core/embed-assets"]

# Test-only: compile the shared wafer-run #319 `DatabaseService` conformance
# suite and the `src/conformance.rs` compile-time assertions that wire the D1
# and KV-cached adapters into it. Off by default so the ~1.3k-line suite never
# enters the production Worker wasm; CI enables it in a dedicated
# `cargo check --features conformance-check` step. Not a runtime block toggle.
conformance-check = ["wafer-core/conformance"]

[dependencies]
# WAFER runtime
wafer-run = { workspace = true }
wafer-block = { workspace = true }
wafer-core = { workspace = true }
# Shared SQL planning (DbExec primitives call introspect::build_table_exists).
wafer-sql-utils = { workspace = true }

# Impresspress shared core. `default-features = false` strips the native
# block set (sqlite/storage-local/llm/etc.); the wasm32-clean feature
# blocks are pulled back in via this crate's own passthrough block
# features (see `[features]` above), and NOTHING here enables one — the
# default build registers only the always-on core blocks.
# Without an enabled `block-X` every `impresspress/<name>` route returns
# "block not found" — the linkme `register_static_block!` path doesn't
# emit on wasm32, so `register_all_static_blocks` is the only
# registration site and every entry there is `#[cfg(feature =
# "block-X")]`-gated on impresspress-core.
impresspress-core = { path = "../impresspress-core", default-features = false }

# Cloudflare Workers SDK
worker = { workspace = true }
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Crypto (wasm-compatible). JWT policy delegates to wafer-block-crypto's
# pure-Rust primitives — same engine as native. Passwords are hashed by the
# password-hasher Worker; `impresspress-password` carries the call protocol.
# Its `durable-object` feature stays OFF here: this Worker binds the class,
# and a Worker that exports one gets no version preview URLs.
wafer-block-crypto = { workspace = true }
impresspress-password = { path = "../impresspress-password" }
getrandom = { workspace = true, features = ["js"] }
# uuid needs the "js" feature for wasm (uses js_sys random); inherit v4+v7 from workspace
uuid = { workspace = true, features = ["js"] }

# Time
chrono = { workspace = true }

# Async
async-trait = { workspace = true }
# Stream combinators for pumping R2/fetch `ByteStream`s and the response
# `OutputStream` into Worker `ReadableStream`s (StreamExt/TryStreamExt).
futures = "0.3"

# Observability
tracing = { workspace = true }

# Templating
maud = { workspace = true }

# This crate cannot compile for a native target at all — `JsFuture` holds an
# `Rc<RefCell<_>>`, so it is `!Send` by construction and the `StorageService`
# impl fails the trait's `Send` bound. Its tests therefore have to run ON
# wasm32, under `wasm-bindgen-test-runner` (see `../../.cargo/config.toml`).
# Before that was wired up, `#[test]` functions here were unreachable from every
# command anyone ran, including whole-workspace runs used to gate merges.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[lints]
workspace = true
